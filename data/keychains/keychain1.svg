<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgk1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181a1f"/>
      <stop offset="100%" stop-color="#0e0f12"/>
    </linearGradient>
    <linearGradient id="metalRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#999999"/>
      <stop offset="100%" stop-color="#e0e0e0"/>
    </linearGradient>
    <linearGradient id="gt3Gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd700"/>
      <stop offset="100%" stop-color="#b8860b"/>
    </linearGradient>
    <filter id="shadowk" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000" flood-opacity="0.55"/>
    </filter>
  </defs>
  <rect width="600" height="600" fill="url(#bgk1)"/>
  <!-- Keyring chain -->
  <g transform="translate(300, 110)">
    <!-- Metal split ring -->
    <circle cx="0" cy="0" r="48" fill="none" stroke="url(#metalRing)" stroke-width="10"/>
    <circle cx="0" cy="0" r="42" fill="none" stroke="#222" stroke-width="1.5"/>
    <!-- Chain links -->
    <rect x="-8" y="48" width="16" height="30" rx="8" fill="none" stroke="url(#metalRing)" stroke-width="6"/>
    <rect x="-8" y="70" width="16" height="30" rx="8" fill="none" stroke="url(#metalRing)" stroke-width="6"/>
  </g>
  <!-- 3D Printed Keychain Body -->
  <g transform="translate(100, 210)" filter="url(#shadowk)">
    <rect width="400" height="230" rx="28" fill="#1c1e24" stroke="#2e323b" stroke-width="3"/>
    <!-- Keyhole eyelet -->
    <circle cx="200" cy="-5" r="16" fill="#1c1e24" stroke="#2e323b" stroke-width="3"/>
    <circle cx="200" cy="-5" r="8" fill="#0e0f12"/>
    <!-- Porsche Silhouette / Car shape -->
    <path d="M 80 150 C 90 120, 130 95, 170 95 L 250 95 C 290 95, 310 120, 330 150 Z" fill="none" stroke="url(#gt3Gold)" stroke-width="6" stroke-linejoin="round"/>
    <!-- GT3 Wing -->
    <rect x="70" y="110" width="40" height="8" rx="3" fill="url(#gt3Gold)"/>
    <line x1="85" y1="118" x2="85" y2="140" stroke="url(#gt3Gold)" stroke-width="4"/>
    <!-- Text -->
    <text x="200" y="175" text-anchor="middle" font-family="'Jost', sans-serif" font-size="28" font-weight="700" fill="#ffffff" letter-spacing="3">GT3 RS</text>
    <text x="200" y="200" text-anchor="middle" font-family="'Jost', sans-serif" font-size="12" font-weight="500" fill="#d4af37" letter-spacing="4">PRECISION 3D PRINTED</text>
  </g>
  <rect x="30" y="30" width="160" height="34" rx="17" fill="#d4af37" opacity="0.9"/>
  <text x="110" y="52" text-anchor="middle" font-family="'Jost', sans-serif" font-size="13" font-weight="700" fill="#121316" letter-spacing="1">3D KEYCHAIN</text>
</svg>