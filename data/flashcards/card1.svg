<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e2024"/>
      <stop offset="100%" stop-color="#121316"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a2c32"/>
      <stop offset="100%" stop-color="#1f2126"/>
    </linearGradient>
    <linearGradient id="gold3d" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f6d365"/>
      <stop offset="50%" stop-color="#fda085"/>
      <stop offset="100%" stop-color="#d4af37"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <filter id="relief" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="3" dy="4" stdDeviation="2" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>
  <rect width="600" height="600" fill="url(#bg)"/>
  <!-- Decorative 3D grid -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="150" x2="600" y2="150"/><line x1="0" y1="300" x2="600" y2="300"/><line x1="0" y1="450" x2="600" y2="450"/>
    <line x1="150" y1="0" x2="150" y2="600"/><line x1="300" y1="0" x2="300" y2="600"/><line x1="450" y1="0" x2="450" y2="600"/>
  </g>
  <!-- Main 3D Card -->
  <g transform="translate(140, 110)" filter="url(#shadow)">
    <rect width="320" height="380" rx="20" fill="url(#cardGrad)" stroke="#3a3d46" stroke-width="2"/>
    <!-- Card Border relief -->
    <rect x="15" y="15" width="290" height="350" rx="14" fill="none" stroke="#d4af37" stroke-dasharray="4 4" stroke-width="1.5" opacity="0.5"/>
    <!-- Raised 3D Letter -->
    <text x="160" y="220" text-anchor="middle" font-family="'Jost', sans-serif" font-size="140" font-weight="800" fill="url(#gold3d)" filter="url(#relief)">A</text>
    <text x="160" y="290" text-anchor="middle" font-family="'Jost', sans-serif" font-size="28" font-weight="600" fill="#ffffff" letter-spacing="4">APPLE</text>
    <text x="160" y="325" text-anchor="middle" font-family="'Jost', sans-serif" font-size="14" font-weight="400" fill="#a0a5b2">Tactile Embossed 3D Print</text>
    <circle cx="280" cy="45" r="14" fill="#d4af37" opacity="0.9"/>
    <text x="280" y="50" text-anchor="middle" font-family="'Jost', sans-serif" font-size="12" font-weight="700" fill="#121316">3D</text>
  </g>
  <!-- Background tilted card -->
  <g transform="translate(80, 140) rotate(-10)" opacity="0.4">
    <rect width="280" height="340" rx="18" fill="#25272e" stroke="#3a3d46" stroke-width="1.5"/>
    <text x="140" y="190" text-anchor="middle" font-family="'Jost', sans-serif" font-size="100" font-weight="700" fill="#ffffff">B</text>
  </g>
  <!-- Badge -->
  <rect x="30" y="30" width="160" height="34" rx="17" fill="#d4af37" opacity="0.9"/>
  <text x="110" y="52" text-anchor="middle" font-family="'Jost', sans-serif" font-size="13" font-weight="700" fill="#121316" letter-spacing="1">TACTILE 3D CARDS</text>
</svg>