<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161b26"/>
      <stop offset="100%" stop-color="#0f1118"/>
    </linearGradient>
    <linearGradient id="mathGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#4facfe"/>
    </linearGradient>
    <filter id="shadow2" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>
  <rect width="600" height="600" fill="url(#bg2)"/>
  <!-- Card group -->
  <g transform="translate(130, 110)" filter="url(#shadow2)">
    <rect width="340" height="380" rx="20" fill="#1e2430" stroke="#2d3647" stroke-width="2"/>
    <text x="170" y="210" text-anchor="middle" font-family="'Jost', sans-serif" font-size="130" font-weight="800" fill="url(#mathGrad)">1 2 3</text>
    <text x="170" y="280" text-anchor="middle" font-family="'Jost', sans-serif" font-size="24" font-weight="600" fill="#ffffff" letter-spacing="3">MATH TILES</text>
    <text x="170" y="315" text-anchor="middle" font-family="'Jost', sans-serif" font-size="14" font-weight="400" fill="#8896b0">Raised Count Dots &amp; Numbers</text>
    <!-- Sensory dots -->
    <g transform="translate(85, 340)">
      <circle cx="20" cy="0" r="8" fill="#4facfe"/>
      <circle cx="50" cy="0" r="8" fill="#4facfe"/>
      <circle cx="80" cy="0" r="8" fill="#4facfe"/>
      <circle cx="110" cy="0" r="8" fill="#4facfe"/>
      <circle cx="140" cy="0" r="8" fill="#4facfe"/>
    </g>
  </g>
  <rect x="30" y="30" width="160" height="34" rx="17" fill="#4facfe" opacity="0.9"/>
  <text x="110" y="52" text-anchor="middle" font-family="'Jost', sans-serif" font-size="13" font-weight="700" fill="#0f1118" letter-spacing="1">LEARNING 3D TILES</text>
</svg>